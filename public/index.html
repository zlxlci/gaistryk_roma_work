<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
  <title>Авторизация — Конференции.РФ</title>
</head>
<body>
  <header class="header-class">
    <h1 id="top">Конференции.РФ</h1>
    <nav>
      <ul>
        <li><a href="index.html">Вход</a></li>
        <li><a href="register.html">Регистрация</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="infosite">
      <h1>Авторизация пользователя</h1>
    </section>

    <div class="wrapper-col">
      <div class="form-card">
        <h2>Вход в систему</h2>
        <form id="loginForm">
          <label>Логин</label>
          <input type="text" name="login" required>
          <label>Пароль</label>
          <input type="password" name="password" required>
          <button type="submit">Войти</button>
        </form>
        <div id="msg" class="msg"></div>
        <a class="link-toggle" href="register.html">Еще не зарегистрированы? Регистрация</a>
      </div>
    </div>
  </main>

  <footer class="footer-site">
    <div><span>&copy; 2026 Self Rights</span> <a href="#top">Go Top of Page</a></div>
  </footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = e.target;
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      try {
        const r = await fetch('/api/auth/login', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ login: f.login.value, password: f.password.value })
        });
        const data = await r.json();
        if (!r.ok) { msg.className='msg error'; msg.textContent = data.error; return; }
        msg.className='msg ok'; msg.textContent = 'Успешный вход';
        setTimeout(() => {
          window.location.href = data.role === 'admin' ? 'admin.html' : 'products.html';
        }, 500);
      } catch { msg.className='msg error'; msg.textContent = 'Ошибка сети'; }
    });
  </script>
</body>
</html>
